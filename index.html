<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var root = document.documentElement;
        var locale = 'pt-BR';
        var theme = 'light';
        try {
          var matchLocale = function (value) {
            if (/^en/i.test(value)) return 'en-US';
            if (/^pt/i.test(value)) return 'pt-BR';
            return null;
          };
          var fromQuery = matchLocale(new URLSearchParams(location.search).get('lang') || '');
          var stored = localStorage.getItem('locale');
          if (fromQuery) {
            locale = fromQuery;
            localStorage.setItem('locale', fromQuery);
          } else if (stored === 'pt-BR' || stored === 'en-US') {
            locale = stored;
          } else {
            var languages = navigator.languages || [navigator.language];
            for (var i = 0; i < languages.length; i++) {
              var match = matchLocale(languages[i] || '');
              if (match) {
                locale = match;
                break;
              }
            }
          }
          var storedTheme = localStorage.getItem('theme');
          if (storedTheme === 'light' || storedTheme === 'dark') {
            theme = storedTheme;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (error) {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        }
        root.lang = locale;
        root.dataset.theme = theme;
      })();
    </script>
    <title>Matheus Rodrigues · Desenvolvedor Web Full Stack</title>
    <meta
